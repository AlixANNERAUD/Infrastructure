---
# Clients trigger their TrueNAS replication task on Bruxelles over SSH, with a
# dedicated replication account and key. On Bruxelles, each client key may only
# run run-replication.sh with its own task identifier, and the TrueNAS API key
# stays there.
- name: Set up replication clients
  hosts: replication
  become: true
  vars:
    replication_user: replication
    replication_home: /var/lib/replication
    replication_service: bruxelles-replicate
  vars_files:
    - ../vault/ansible/vault.yml
  tasks:
    - name: Create the replication account
      ansible.builtin.user:
        name: "{{ replication_user }}"
        system: true
        home: "{{ replication_home }}"
        create_home: true
        shell: /usr/sbin/nologin
        password_lock: true
        state: present

    - name: Create the replication SSH folder
      ansible.builtin.file:
        path: "{{ replication_home }}/.ssh"
        state: directory
        owner: "{{ replication_user }}"
        group: "{{ replication_user }}"
        mode: "0700"

    - name: Generate the replication key
      ansible.builtin.command:
        argv: [ssh-keygen, -t, ed25519, -N, "", -q, -C, "replication@{{ inventory_hostname }}", -f, "{{ replication_home }}/.ssh/id_ed25519"]
        creates: "{{ replication_home }}/.ssh/id_ed25519"

    - name: Give the replication key to its account
      ansible.builtin.file:
        path: "{{ replication_home }}/.ssh/{{ item }}"
        owner: "{{ replication_user }}"
        group: "{{ replication_user }}"
      loop:
        - id_ed25519
        - id_ed25519.pub

    - name: Read the replication public key
      ansible.builtin.slurp:
        src: "{{ replication_home }}/.ssh/id_ed25519.pub"
      register: replication_public_key

    - name: Create the replication service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ replication_service }}.service"
        mode: "0644"
        content: |
          [Unit]
          Description=Trigger the TrueNAS replication task on Bruxelles
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User={{ replication_user }}
          # The key is bound to this host's task on Bruxelles, so no command is sent
          ExecStart=/usr/bin/ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new {{ replication_user }}@{{ hostvars['bruxelles'].ansible_host }}

    - name: Create the replication timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ replication_service }}.timer"
        mode: "0644"
        content: |
          [Unit]
          Description=Run the Bruxelles replication twice a day

          [Timer]
          OnCalendar=*-*-* 00/12:00:00
          Persistent=true
          RandomizedDelaySec=5min

          [Install]
          WantedBy=timers.target

    - name: Enable the replication timer
      ansible.builtin.systemd:
        name: "{{ replication_service }}.timer"
        state: started
        enabled: true
        daemon_reload: true

- name: Set up replication on Bruxelles
  hosts: bruxelles
  become: true
  vars:
    # Created in the TrueNAS interface, see the readme
    replication_user: replication
    replication_directory: "{{ services_root }}/Replication"
  vars_files:
    - ../vault/ansible/vault.yml
    - ../vault/replication/vault.yml
  tasks:
    - name: Look up the replication user
      ansible.builtin.getent:
        database: passwd
        key: "{{ replication_user }}"
        fail_key: false

    - name: Explain how to create the replication user
      ansible.builtin.debug:
        msg:
          - "Create the {{ replication_user }} user in the TrueNAS interface (Credentials > Users), then run this playbook again:"
          - Home folder on the pool, shell /usr/bin/sh (not nologin, the forced command runs through it), no sudo, password login disabled
      when: ansible_facts.getent_passwd[replication_user] is none

    - name: Skip Bruxelles until the replication user exists
      ansible.builtin.meta: end_host
      when: ansible_facts.getent_passwd[replication_user] is none

    - name: Create the replication folder
      ansible.builtin.file:
        path: "{{ replication_directory }}"
        state: directory
        owner: root
        group: "{{ replication_user }}"
        mode: "0750"

    - name: Store the TrueNAS API key
      ansible.builtin.copy:
        dest: "{{ replication_directory }}/api_key"
        content: "{{ bruxelles_api_key }}"
        owner: "{{ replication_user }}"
        group: "{{ replication_user }}"
        mode: "0400"
      no_log: true

    - name: Install the forced command
      ansible.builtin.copy:
        dest: "{{ replication_directory }}/run-replication.sh"
        owner: root
        group: "{{ replication_user }}"
        mode: "0750"
        content: |
          #!/bin/sh
          # Forced command of the replication SSH keys: runs one TrueNAS replication task
          set -eu
          case "${1:-}" in
              ''|*[!0-9]*) echo "Usage: run-replication.sh <task identifier>" >&2; exit 1 ;;
          esac
          exec midclt -K "$(cat {{ replication_directory }}/api_key)" call replication.run "$1"

    - name: Read the replication user's authorized keys
      ansible.builtin.slurp:
        src: "{{ ansible_facts.getent_passwd[replication_user][4] }}/.ssh/authorized_keys"
      register: replication_authorized_keys
      failed_when: false

    - name: Build the expected authorized keys
      ansible.builtin.set_fact:
        replication_expected_keys: "{{ replication_expected_keys | default([]) + [replication_key_line] }}"
      vars:
        replication_key_line: >-
          command="{{ replication_directory }}/run-replication.sh {{ hostvars[item].bruxelles_replication_identifier }}",restrict
          {{ hostvars[item].replication_public_key.content | b64decode | trim }}
      loop: "{{ groups['replication'] }}"
      when: hostvars[item].replication_public_key is defined

    - name: Explain which keys to add in the TrueNAS interface
      ansible.builtin.debug:
        msg: "{{ ['Add these lines to Credentials > Users > ' ~ replication_user ~ ' > Authorized Keys:'] + replication_missing_keys }}"
      vars:
        replication_current_keys: "{{ replication_authorized_keys.content | default('') | b64decode }}"
        replication_missing_keys: "{{ replication_expected_keys | default([]) | reject('in', replication_current_keys) | list }}"
      when: replication_missing_keys | length > 0
