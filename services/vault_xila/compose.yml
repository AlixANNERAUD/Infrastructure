services:
  openbao:
    image: openbao/openbao:2.7.2
    user: "568:568"
    command: ["server", "-config=/openbao/config/config.hcl"]
    restart: unless-stopped
    environment:
      BAO_API_ADDR: ${BAO_API_ADDR:?Set BAO_API_ADDR}
      SKIP_CHOWN: "true"
    volumes:
      - ./data:/openbao/data
      - ./logs:/openbao/logs
      - ./config.hcl:/openbao/config/config.hcl:ro
      - ./tls:/openbao/tls:ro
    expose:
      - "8200"
    networks:
      - proxy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "bao status -tls-skip-verify -address=https://127.0.0.1:8200 >/dev/null 2>&1; status=$$?; test $$status -eq 0 -o $$status -eq 2"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  proxy:
    external: true
