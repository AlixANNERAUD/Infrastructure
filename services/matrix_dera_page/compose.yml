# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  synapse:
    image: docker.io/matrixdotorg/synapse:v1.163.2
    logging: *logging
    # Since synapse does not retry to connect to the database, restart upon
    # failure
    restart: unless-stopped
    # See the readme for a full documentation of the environment settings
    # NOTE: You must edit homeserver.yaml to use postgres, it defaults to sqlite
    volumes:
      - ./synapse_data:/data
    depends_on:
      - database
    networks:
      - traefik
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.matrix-dera-page.rule=Host(`matrix.dera.page`)
      - traefik.http.routers.matrix-dera-page.entrypoints=web-secure,web-secure-federation
      - traefik.http.routers.matrix-dera-page.tls=true
      - traefik.http.routers.matrix-dera-page.tls.certresolver=letsencrypt
      - traefik.http.services.matrix-dera-page.loadbalancer.server.port=8008
      - traefik.http.services.matrix-dera-page.loadbalancer.server.scheme=http

      # The admin API stays internal; its longer rule wins over the router above
      - traefik.http.routers.synapse-admin-api.rule=Host(`matrix.dera.page`) && PathPrefix(`/_synapse/admin`)
      - traefik.http.routers.synapse-admin-api.entrypoints=web-secure,web-secure-federation
      - traefik.http.routers.synapse-admin-api.tls=true
      - traefik.http.routers.synapse-admin-api.tls.certresolver=letsencrypt
      - traefik.http.routers.synapse-admin-api.service=matrix-dera-page
      - traefik.http.routers.synapse-admin-api.middlewares=internal-allowlist@file

  database:
    image: docker.io/postgres:18.6
    logging: *logging
    restart: unless-stopped
    # Change that password, of course!
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      # ensure the database gets created correctly
      # https://element-hq.github.io/synapse/latest/postgres.html#set-up-database
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      # You may store the database tables in a local folder..
      - ./postgres_data:/var/lib/postgresql
      # .. or store them on some high performance storage for better results
      # - /path/to/ssd/storage:/var/lib/postgresql/data
    networks:
      - internal

  well-known:
    image: nginx:1.31.8-alpine
    logging: *logging
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.wellknown.rule=(Host(`dera.page`) || Host(`matrix.dera.page`)) && PathPrefix(`/.well-known/matrix/`)
      - traefik.http.routers.wellknown.entrypoints=web-secure,web-secure-federation
      - traefik.http.routers.wellknown.tls=true
      - traefik.http.routers.wellknown.tls.certresolver=letsencrypt
      - traefik.http.services.wellknown.loadbalancer.server.port=80
      - traefik.http.services.wellknown.loadbalancer.server.scheme=http

  pgbackups:
    image: prodrigestivill/postgres-backup-local:18-debian-d257e5d
    logging: *logging
    restart: always
    # user: postgres:postgres # Optional: see below
    volumes:
      - ./postgres_backup:/backups
    depends_on:
      - database
    networks:
      - internal
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      #  - POSTGRES_PASSWORD_FILE=/run/secrets/db_password <-- alternative for POSTGRES_PASSWORD (to use with docker secrets)
      - POSTGRES_EXTRA_OPTS=-Z1 --schema=public --blobs
      - SCHEDULE=@daily
      - BACKUP_ON_START=TRUE
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080

  # Synapse admin UI (etkecc/synapse-admin, now called Ketesa), served under /admin
  synapse-admin:
    hostname: synapse-admin
    image: ghcr.io/etkecc/ketesa:v1.5.2
    logging: *logging
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.synapse-admin.rule=Host(`matrix.dera.page`) && PathPrefix(`/admin`)

      - "traefik.http.middlewares.admin-slashless-redirect.redirectregex.regex=(/admin)$$"
      - "traefik.http.middlewares.admin-slashless-redirect.redirectregex.replacement=$${1}/"
      - "traefik.http.middlewares.admin-strip-prefix.stripprefix.prefixes=/admin"
      - "traefik.http.routers.synapse-admin.middlewares=internal-allowlist@file,admin-slashless-redirect,admin-strip-prefix"

      - traefik.http.routers.synapse-admin.entrypoints=web-secure
      - traefik.http.routers.synapse-admin.tls=true
      - traefik.http.routers.synapse-admin.tls.certresolver=letsencrypt
      - traefik.http.services.synapse-admin.loadbalancer.server.port=8080
      - traefik.http.services.synapse-admin.loadbalancer.server.scheme=http
    networks:
      - traefik

networks:
  traefik:
    external: true
  # Database side only: no route out of the Docker network
  internal:
    internal: true
