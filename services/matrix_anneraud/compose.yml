# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  synapse:
    image: docker.io/matrixdotorg/synapse:v1.163.2
    logging: *logging
    # Since synapse does not retry to connect to the database, restart upon
    # failure
    restart: unless-stopped
    # See the readme for a full documentation of the environment settings
    # NOTE: You must edit homeserver.yaml to use postgres, it defaults to sqlite
    volumes:
      - ./Synapse_data:/data
    depends_on:
      - database
    # In order to expose Synapse, remove one of the following, you might for
    # instance expose the TLS port directly:
    networks:
      - internal
      - proxy

  database:
    image: docker.io/postgres:18
    logging: *logging
    restart: unless-stopped
    # Change that password, of course!
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      # ensure the database gets created correctly
      # https://element-hq.github.io/synapse/latest/postgres.html#set-up-database
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      # You may store the database tables in a local folder..
      - ./Postgres_data:/var/lib/postgresql
      # .. or store them on some high performance storage for better results
      # - /path/to/ssd/storage:/var/lib/postgresql/data
    networks:
      - internal
      - databases

networks:
  # Database side only: no route out of the Docker network
  internal:
    internal: true
  # Shared with Databasus, which backs the databases up; created by the
  # compose_service role (compose_service_external_networks)
  databases:
    external: true
  proxy:
    external: true
