---
- name: Deploy HA-Linky
  hosts: ha_linky
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/ha-linky/vault.yml
  roles:
    - role: compose_service
      vars:
        compose_service_name: ha_linky
        compose_service_directory: HA-Linky
        compose_service_user: 568
        compose_service_templates:
          - source: options.json.j2
            destination: options.json
        compose_service_environment:
          HOME_ASSISTANT_WEBSOCKET_URL: "{{ home_assistant_websocket_url }}"
          HOME_ASSISTANT_SUPERVISOR_TOKEN: "{{ home_assistant_supervisor_token }}"
