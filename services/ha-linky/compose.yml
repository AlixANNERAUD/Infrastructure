# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  ha-linky:
    image: ghcr.io/alixanneraud/ha-linky-standalone:latest@sha256:7035e0385337577b4124ed708abc0594ee73b252d50c82f182791d21cb351ed7
    logging: *logging
    container_name: ha-linky
    restart: unless-stopped
    volumes:
      - ./options.json:/data/options.json
    environment:
      TZ: "Europe/Paris"
      WS_URL: ${HOME_ASSISTANT_WEBSOCKET_URL}
      SUPERVISOR_TOKEN: ${HOME_ASSISTANT_SUPERVISOR_TOKEN}
