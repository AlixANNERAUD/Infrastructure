---
- name: Configure Cockpit for Existing Traefik Setup
  hosts: cockpit
  become: true
  vars:
    cockpit_domain: "cockpit.luxembourg.anneraud.fr"
    cockpit_root_dir: "/opt/cockpit"

    cockpit_conf_dir: "/etc/cockpit"
    cockpit_conf_file: "{{ cockpit_conf_dir }}/cockpit.conf"

    # Traefik reaches Cockpit through host.docker.internal, which is the docker0 address
    cockpit_listen_address: "{{ ansible_facts['docker0']['ipv4']['address'] }}"

    traefik_dynamic_config_dir: "{{ services_root }}/{{ traefik_directory }}/dynamic"
    traefik_cockpit_config_file: "{{ traefik_dynamic_config_dir }}/cockpit.yml"
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/cloudflare/vault.yml
  tasks:
    - name: Ensure Cockpit root directory exists
      ansible.builtin.file:
        path: "{{ cockpit_root_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure Cockpit package is installed
      ansible.builtin.apt:
        name: cockpit
        state: present
        update_cache: true

    - name: Ensure Cockpit system config directory exists
      ansible.builtin.file:
        path: "{{ cockpit_conf_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy Cockpit reverse proxy config
      ansible.builtin.template:
        src: cockpit.conf.j2
        dest: "{{ cockpit_conf_file }}"
        mode: "0644"
      notify: Restart Cockpit Service

    - name: Ensure Cockpit socket override directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/cockpit.socket.d
        state: directory
        mode: "0755"

    # Cockpit serves plain HTTP behind Traefik, so keep it off public interfaces
    - name: Listen only on the Docker bridge
      ansible.builtin.copy:
        dest: /etc/systemd/system/cockpit.socket.d/listen.conf
        content: |
          [Socket]
          ListenStream=
          ListenStream={{ cockpit_listen_address }}:9090
          FreeBind=yes
        mode: "0644"
      notify: Restart Cockpit Socket

    - name: Ensure Cockpit socket is running
      ansible.builtin.systemd:
        name: cockpit.socket
        enabled: true
        state: started

    - name: Deploy Traefik dynamic routing file for Cockpit
      ansible.builtin.template:
        src: traefik_cockpit.yml.j2
        dest: "{{ traefik_cockpit_config_file }}"
        mode: "0644"

    - name: Update DNS records for Cockpit
      community.general.cloudflare_dns:
        zone: anneraud.fr
        account_email: "{{ cloudflare_email }}"
        account_api_key: "{{ cloudflare_api_key }}"
        type: CNAME
        record: cockpit.luxembourg.anneraud.fr
        value: "{{ local_dns_host }}"

  handlers:
    - name: Restart Cockpit Socket
      ansible.builtin.systemd:
        name: cockpit.socket
        state: restarted
        daemon_reload: true

    - name: Restart Cockpit Service
      ansible.builtin.systemd:
        name: cockpit.service
        state: restarted
