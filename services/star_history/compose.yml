# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  star_history:
    image: ghcr.io/mubelotix/simrepo:sha-92deec0
    logging: *logging
    container_name: star_history
    user: "${USER_ID}:${GROUP_ID}"
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${STAR_HISTORY_GH_TOKEN}
      # yamllint disable-line rule:line-length
      RATE_LIMIT_WHITELIST_IPS: "192.30.252.0/22,185.199.108.0/22,140.82.112.0/20,143.55.64.0/20,2a0a:a440::/29,2606:50c0::/32,20.201.28.151/32,20.205.243.166/32,20.87.245.0/32,4.237.22.38/32,4.228.31.150/32,20.207.73.82/32,20.27.177.113/32,20.200.245.247/32,20.175.192.147/32,20.233.83.145/32,20.29.134.23/32,20.199.39.232/32,20.217.135.5/32,4.225.11.194/32,4.208.26.197/32,20.26.156.215/32,172.182.252.133/32,4.249.131.164/32,48.202.248.40/32,48.204.201.5/32"
    volumes:
      - /opt/star_history/repos.sqlite:/app/repos.sqlite
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.star-repo.rule=Host(`star-history.dera.page`) || Host(`simrepo.dera.page`)
      - traefik.http.routers.star-repo.entrypoints=web-secure
      - traefik.http.routers.star-repo.tls=true
      - traefik.http.routers.star-repo.tls.certresolver=letsencrypt
      - traefik.http.routers.star-repo.service=star-repo
      - traefik.http.routers.star-repo.middlewares=star-repo-cors
      - traefik.http.services.star-repo.loadbalancer.server.port=8080
      - traefik.http.services.star-repo.loadbalancer.server.scheme=http
      - traefik.http.middlewares.star-repo-cors.headers.accesscontrolalloworiginlist=*
      - traefik.http.middlewares.star-repo-cors.headers.accesscontrolallowcredentials=true
      - traefik.http.middlewares.star-repo-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS
      - traefik.http.middlewares.star-repo-cors.headers.accesscontrolallowheaders=Origin,Content-Type,Accept,Authorization,Api-Key
      - traefik.http.middlewares.star-repo-cors.headers.accesscontrolmaxage=1728000
      - traefik.http.middlewares.star-repo-cors.headers.addvaryheader=true

networks:
  traefik:
    external: true
