---
- name: Deploy Star History
  hosts: star_history
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/star_history/vault.yml
    - ../../vault/cloudflare/vault.yml
  roles:
    - role: compose_service
      vars:
        compose_service_name: star_history
        compose_service_user: 991
        compose_service_mounted_files:
          - repos.sqlite
        compose_service_environment:
          STAR_HISTORY_GH_TOKEN: "{{ github_token }}"
        compose_service_dns_records:
          - record: star-history.dera.page
          - record: simrepo.dera.page
