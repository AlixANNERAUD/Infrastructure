---
- name: Deploy Wakapi
  hosts: wakapi
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/wakapi/vault.yml
    - ../../vault/cloudflare/vault.yml
  roles:
    - role: compose_service
      vars:
        compose_service_name: wakapi
        compose_service_directory: Wakapi
        compose_service_user: 568
        compose_service_environment:
          WAKAPI_PORT: 30078
          WAKAPI_TRUST_REVERSE_PROXY_IPS: 172.16.0.0/16
          WAKAPI_PUBLIC_URL: https://wakapi.dera.page
          DATABASE_PASSWORD: "{{ database_password }}"
          DATABASE_USER: "{{ database_user }}"
          WAKAPI_PASSWORD_SALT: "{{ wakapi_password_salt }}"
          WAKAPI_MAIL_SMTP_HOST: "{{ wakapi_mail_smtp_host }}"
          WAKAPI_MAIL_SMTP_USER: "{{ wakapi_mail_smtp_user }}"
          WAKAPI_MAIL_SMTP_PASS: "{{ wakapi_mail_smtp_pass }}"
        compose_service_dns_records:
          - record: wakapi.dera.page
          - record: wakapi.anneraud.fr
