---
- name: Deploy Gatus (anneraud.fr)
  hosts: gatus_anneraud
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/gatus_anneraud/vault.yml
    - ../../vault/cloudflare/vault.yml
  roles:
    - role: compose_service
      vars:
        compose_service_name: gatus_anneraud
        compose_service_files:
          - source: config.yml
            destination: config/config.yml
        compose_service_environment:
          HOME_ASSISTANT_URL: https://maison.anneraud.fr
          PROXY_RULE: Host(`etat.anneraud.fr`)
          STACK_NAME: gatus-anneraud
          DATABASE_USER: "{{ database_user }}"
          DATABASE_PASSWORD: "{{ database_password }}"
          HOME_ASSISTANT_TOKEN: "{{ home_assistant_token }}"
        compose_service_dns_records:
          - record: etat.anneraud.fr
