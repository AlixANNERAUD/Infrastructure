# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  docmost:
    image: docmost/docmost:0.97
    logging: *logging
    depends_on:
      - db
      - redis
    environment:
      APP_URL: ${APP_URL}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}?schema=public"
      REDIS_URL: "redis://redis:6379"
    restart: unless-stopped
    volumes:
      - ./Storage:/app/data/storage
    networks:
      - internal
      - proxy

  db:
    image: postgres:18-alpine
    logging: *logging
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    restart: unless-stopped
    volumes:
      - ./Postgres_data:/var/lib/postgresql
    networks:
      - internal
      - databases

  redis:
    image: redis:8-alpine
    logging: *logging
    restart: unless-stopped
    volumes:
      - ./Redis_data:/data
    networks:
      - internal

networks:
  # Database side only: no route out of the Docker network
  internal:
    internal: true
  # Shared with Databasus, which backs the databases up; created by the
  # compose_service role (compose_service_external_networks)
  databases:
    external: true
  proxy:
    external: true
