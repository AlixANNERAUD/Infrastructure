---
- name: Deploy Notes (Docmost)
  hosts: notes
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/notes/vault.yml
    - ../../vault/cloudflare/vault.yml
  roles:
    - role: compose_service
      vars:
        compose_service_name: notes
        compose_service_directory: Docmost
        compose_service_user: 568
        compose_service_environment:
          DATABASE_USER: "{{ database_user }}"
          DATABASE_PASSWORD: "{{ database_password }}"
          APP_SECRET: "{{ app_secret }}"
          APP_URL: https://notes.anneraud.fr
          DATABASE_NAME: docmost
        compose_service_dns_records:
          - record: notes.anneraud.fr
