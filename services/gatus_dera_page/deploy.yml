---
- name: Deploy Gatus (dera.page)
  hosts: gatus_dera_page
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/gatus_dera_page/vault.yml
    - ../../vault/cloudflare/vault.yml
  roles:
    - role: compose_service
      vars:
        compose_service_name: gatus_dera_page
        compose_service_directory: gatus_derapage
        compose_service_files:
          - source: config.yml
            destination: config/config.yml
        compose_service_environment:
          PROXY_RULE: Host(`status.dera.page`)
          STACK_NAME: gatus-derapage
          DATABASE_USER: "{{ database_user }}"
          DATABASE_PASSWORD: "{{ database_password }}"
        compose_service_dns_records:
          - record: status.dera.page
