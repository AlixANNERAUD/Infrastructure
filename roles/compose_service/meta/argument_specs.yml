---
argument_specs:
  main:
    short_description: Deploy a Docker Compose stack from the playbook folder
    options:
      compose_service_name:
        type: str
        required: true
        description: Service name, used for the default folder name.
      compose_service_directory:
        type: str
        description: Folder name under services_root.
      compose_service_path:
        type: str
        description: Full path of the service folder.
      compose_service_user:
        type: raw
        description: Owner (name or UID) of the service files.
      compose_service_group:
        type: raw
        description: Group (name or GID) of the service files.
      compose_service_environment:
        type: dict
        description: Variables written to .env.
      compose_service_directories:
        type: list
        elements: str
        description: Folders to create inside the service folder.
      compose_service_templates:
        type: list
        elements: dict
        description: >-
          Jinja templates to render, with source and destination. An entry with
          restart set to false does not restart the stack when it changes.
      compose_service_files:
        type: list
        elements: dict
        description: >-
          Extra files to copy, with source and destination. An entry with
          restart set to false does not restart the stack when it changes,
          for files the service reloads itself.
      compose_service_mounted_files:
        type: list
        elements: str
        description: Files to create before they are bind-mounted.
      compose_service_external_networks:
        type: list
        elements: dict
        default: []
        description: >-
          Networks declared external in compose.yml, created before the stack
          starts when they do not exist yet (existing ones are never changed),
          each with a name and an internal flag (default false).
      compose_service_dns_records:
        type: list
        elements: dict
        description: CNAME records pointing to the host.
