# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  app:
    image: busybox:1.37
    logging: *logging
    command: sleep 3600
    user: "${USER_ID}:${GROUP_ID}"
    volumes:
      - ./config/config.yml:/config.yml:ro
      - ./config/reloaded.yml:/reloaded.yml:ro
      - ./data.sqlite:/data.sqlite
