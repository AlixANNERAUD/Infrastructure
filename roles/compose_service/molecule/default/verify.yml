---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the service files
      ansible.builtin.stat:
        path: "{{ compose_service_test_path }}/{{ item }}"
      register: compose_service_test_files
      loop:
        - compose.yml
        - .env
        - config/config.yml
        - settings/settings.json
        - data.sqlite

    - name: Check the service files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "{{ item.item }} is missing or is not a regular file"
      loop: "{{ compose_service_test_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check that .env is private
      ansible.builtin.assert:
        that: compose_service_test_files.results[1].stat.mode == '0600'

    - name: Read .env
      ansible.builtin.slurp:
        src: "{{ compose_service_test_path }}/.env"
      register: compose_service_test_environment

    - name: Check .env contents
      ansible.builtin.assert:
        that:
          - "'USER_ID=' ~ lookup('ansible.builtin.pipe', 'id -u') in content"
          - "'PROXY_RULE=Host(`molecule.example`)' in content"
      vars:
        content: "{{ compose_service_test_environment.content | b64decode }}"

    - name: Read the inner folder
      ansible.builtin.stat:
        path: "{{ compose_service_test_path }}/data"
      register: compose_service_test_data

    - name: Check the inner folder
      ansible.builtin.assert:
        that:
          - compose_service_test_data.stat.isdir
          - compose_service_test_data.stat.mode == '0750'

    - name: Read the rendered template
      ansible.builtin.slurp:
        src: "{{ compose_service_test_path }}/settings/settings.json"
      register: compose_service_test_settings

    - name: Check the rendered template
      ansible.builtin.assert:
        that: (compose_service_test_settings.content | b64decode | from_json).greeting == 'hello from molecule'

    - name: List running containers
      ansible.builtin.command:
        argv: [docker, compose, ps, --status, running, --services]
        chdir: "{{ compose_service_test_path }}"
      register: compose_service_test_running
      changed_when: false

    - name: Check that the stack is running
      ansible.builtin.assert:
        that: "'app' in compose_service_test_running.stdout_lines"

    - name: Look up the external network
      community.docker.docker_network_info:
        name: molecule_test_database
      register: compose_service_test_network

    - name: Check the external network
      ansible.builtin.assert:
        that:
          - compose_service_test_network.exists
          - compose_service_test_network.network.Internal

    - name: Read when the container started
      ansible.builtin.command:
        argv: [docker, compose, ps, --quiet, app]
        chdir: "{{ compose_service_test_path }}"
      register: compose_service_test_container
      changed_when: false

    - name: Remember when the container started
      community.docker.docker_container_info:
        name: "{{ compose_service_test_container.stdout }}"
      register: compose_service_test_before

# Only the file that restarts nothing changes
- name: Converge again with a changed reloaded file
  ansible.builtin.import_playbook: converge.yml
  vars:
    compose_service_test_reloaded_source: reloaded_second.yml

- name: Verify the stack was not restarted
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the reloaded file
      ansible.builtin.slurp:
        src: "{{ compose_service_test_path }}/config/reloaded.yml"
      register: compose_service_test_reloaded

    - name: Look up the container again
      community.docker.docker_container_info:
        name: "{{ compose_service_test_before.container.Id }}"
      register: compose_service_test_after

    - name: Check that the file changed without restarting the container
      ansible.builtin.assert:
        that:
          - "'revision: second' in compose_service_test_reloaded.content | b64decode"
          - compose_service_test_after.exists
          - compose_service_test_after.container.State.StartedAt == compose_service_test_before.container.State.StartedAt
          - compose_service_test_after.container.Id == compose_service_test_before.container.Id
