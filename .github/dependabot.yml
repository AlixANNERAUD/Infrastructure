---
# Dependency updates, grouped per ecosystem into one weekly PR each.
# Ansible collections (requirements.yml) and .python-version are not supported
# by Dependabot and are updated by hand.
version: 2
updates:
  - package-ecosystem: docker-compose
    directories:
      - /services/*
      - /roles/*/molecule/*
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    groups:
      docker-compose:
        patterns: ["*"]
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    groups:
      python-tooling:
        patterns: ["*"]
    labels: [dependencies, python]
