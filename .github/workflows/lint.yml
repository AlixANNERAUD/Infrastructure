---
name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ansible:
    name: yamllint and ansible-lint
    runs-on: ubuntu-latest
    steps:
      # The vault submodule is private and not needed for linting
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install tools
        run: |
          uv sync --locked
          uv run ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: uv run yamllint --format github .

      # Playbooks load encrypted vault files, so lint against empty placeholders
      - name: Create vault placeholders
        run: |
          git grep -hoE 'vault/[a-z_-]+/vault\.yml' -- services hosts dns | sort -u | while read -r file; do
            mkdir -p "$(dirname "$file")"
            echo "---" > "$file"
          done

      - name: ansible-lint
        run: uv run ansible-lint

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate Compose files
        run: .github/scripts/check-compose.sh

  molecule:
    name: molecule (compose_service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install tools
        run: |
          uv sync --locked
          uv run ansible-galaxy collection install -r requirements.yml

      - name: Test the compose_service role
        working-directory: roles/compose_service
        run: uv run molecule test

  opentofu:
    name: tofu fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Installs the OpenTofu version pinned in mise.toml
      - uses: jdx/mise-action@v5.2.4

      - name: Check formatting
        run: tofu fmt -check -recursive opentofu

      - name: Validate the Zitadel configuration
        working-directory: opentofu/zitadel
        run: tofu init -backend=false && tofu validate

  molecule-zitadel:
    name: molecule (zitadel_applications)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - uses: jdx/mise-action@v5.2.4

      - name: Install tools
        run: |
          uv sync --locked
          uv run ansible-galaxy collection install -r requirements.yml

      - name: Test the zitadel_applications role
        working-directory: roles/zitadel_applications
        run: uv run molecule test

  traefik-routes:
    name: Traefik routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install tools
        run: |
          uv sync --locked
          uv run ansible-galaxy collection install -r requirements.yml

      - name: Load the rendered routes in Traefik
        run: .github/scripts/check-traefik-routes.sh

  # Single check required by the branch ruleset: add new jobs to `needs`
  required:
    name: required
    if: always()
    needs: [ansible, compose, molecule, molecule-zitadel, opentofu, traefik-routes]
    runs-on: ubuntu-latest
    steps:
      - name: Check that all required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed"
              exit 1
            fi
          done
